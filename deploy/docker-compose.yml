name: todo

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo}
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo}
      TZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - todo-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - todo-net

  s3:
    image: rustfs/rustfs:1.0.4
    container_name: todo-s3
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-todo-s3}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-todo-s3-secret}
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_CORS_ALLOWED_ORIGINS: "${S3_CORS_ALLOWED_ORIGINS:-*}"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "${S3_CORS_ALLOWED_ORIGINS:-*}"
      RUSTFS_CHECK_UPDATE: "false"
      TZ: UTC
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - todo-s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - todo-net

  s3-init:
    image: amazon/aws-cli:2.38.6
    container_name: todo-s3-init
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/s3/init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-todo-s3}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-todo-s3-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_PAGER: ""
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET_AUDIO: ${S3_BUCKET_AUDIO:-audio}
      S3_BUCKET_TTS: ${S3_BUCKET_TTS:-tts}
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-7}
    volumes:
      - ./s3:/s3:ro
    networks:
      - todo-net

networks:
  todo-net:
    name: todo-net
    driver: bridge

volumes:
  todo-postgres-data:
    name: todo-postgres-data
  todo-s3-data:
    name: todo-s3-data
