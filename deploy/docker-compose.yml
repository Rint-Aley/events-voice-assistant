name: todo

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo}
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo}
      TZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - todo-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - todo-net

  s3:
    image: rustfs/rustfs:1.0.4
    container_name: todo-s3
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-todo-s3}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-todo-s3-secret}
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_CORS_ALLOWED_ORIGINS: "${S3_CORS_ALLOWED_ORIGINS:-*}"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "${S3_CORS_ALLOWED_ORIGINS:-*}"
      RUSTFS_CHECK_UPDATE: "false"
      TZ: UTC
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - todo-s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - todo-net

  s3-init:
    image: amazon/aws-cli:2.38.6
    container_name: todo-s3-init
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/s3/init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-todo-s3}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-todo-s3-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_PAGER: ""
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET_AUDIO: ${S3_BUCKET_AUDIO:-audio}
      S3_BUCKET_TTS: ${S3_BUCKET_TTS:-tts}
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-7}
    volumes:
      - ./s3:/s3:ro
    networks:
      - todo-net

  voice-stt:
    build:
      context: ../src/stt
      dockerfile: Dockerfile
    container_name: voice-stt
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STT_PORT:-8010}:8010"
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      STT_MODEL: ${STT_MODEL:-base}
      STT_DEADLINE_SECONDS: ${STT_DEADLINE_SECONDS:-25}
    depends_on:
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s
    networks:
      - todo-net

  voice-tts:
    build:
      context: ../src/tts
      dockerfile: Dockerfile
    container_name: voice-tts
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TTS_PORT:-8020}:8020"
    environment:
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-todo-s3}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-todo-s3-secret}
      S3_BUCKET_TTS: ${S3_BUCKET_TTS:-tts}
      S3_REGION: ${S3_REGION:-us-east-1}
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-ru-RU-SvetlanaNeural}
      TTS_DEFAULT_FORMAT: ${TTS_DEFAULT_FORMAT:-mp3}
      TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-20}
    depends_on:
      s3:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health')\""]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - todo-net

  web:
    build:
      context: ../src/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: todo-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    environment:
      # TaskManager пока запускается на хосте; после его контейнеризации
      # задайте TASKMANAGER_URL=http://taskmanager:8080.
      TASKMANAGER_URL: ${TASKMANAGER_URL:-http://host.docker.internal:5000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - todo-net

networks:
  todo-net:
    name: todo-net
    driver: bridge

volumes:
  todo-postgres-data:
    name: todo-postgres-data
  todo-s3-data:
    name: todo-s3-data
